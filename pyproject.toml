[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "alm-sounding-actions"
version = "1.0.0"
description = "Rebuild the sounding-actions benchmark for audio-language models from Ego4D and Ego-Exo4D"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.23,<2.0",
    "pandas>=2.0,<3.0",
    "soundfile>=0.12",
    "tqdm>=4.66",
]

[project.optional-dependencies]
# Only needed to re-run the construction pipeline (scripts/construct_benchmark.py).
# These are the versions used for the paper; torchaudio>=2.9 changed `torchaudio.load`.
construction = [
    "torch==2.8.0",
    "torchaudio==2.8.0",
    "transformers==4.56.0",
    "msclap==1.3.4",
]

[tool.setuptools]
packages = ["sounding_actions", "sounding_actions.construction"]
